# Workspace root. Nothing here is published -- it exists so that `uv sync` gives
# you every package editable in one venv, and so lint/type/test config is stated
# once instead of three times.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
packages = ["multiset.vps", "multiset.unitree.go2"]
ignore_missing_imports = true
warn_unused_ignores = true
# Both packages ship py.typed, which promises the hints are complete.
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.pytest.ini_options]
testpaths = ["packages"]
markers = [
  # Hardware tests need a robot or a camera on the LAN and credentials; they are
  # excluded from CI, which has neither.
  "hardware: needs a real device (deselect with -m 'not hardware')",
  "network: needs internet or the MultiSet API",
]
# --import-mode=importlib: a monorepo has packages/vps/tests/test_settings.py AND
# packages/unitree-go2/tests/test_settings.py, and the legacy prepend mode
# imports both as the module "test_settings" and errors on the second.
addopts = "-m 'not hardware and not network' --import-mode=importlib"

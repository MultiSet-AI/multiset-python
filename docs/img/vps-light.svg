<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img"
     aria-label="A picture you already have, plus your lens numbers, is matched against your map by MultiSet VPS, and the place it was taken appears in the point cloud.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7828B8" fill-opacity=".5"/>
    </marker>
    <clipPath id="room"><rect x="572" y="90" width="300" height="128" rx="8"/></clipPath>
  </defs>
  <style>
    .pane { fill:#7828B8; fill-opacity:.05; stroke:#7828B8; stroke-opacity:.38; stroke-width:1.4 }
    .step { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size:12px; font-weight:600; fill:#380868 }
    .cap  { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size:11.5px; fill:#7828B8; fill-opacity:.9 }
    .num  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; fill:#7828B8 }
    .lens { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10.5px; fill:#7828B8; fill-opacity:.8 }
    .dog  { fill:#7828B8; fill-opacity:.9 }
    .leg  { stroke:#7828B8; stroke-opacity:.9; stroke-width:3.4; stroke-linecap:round }
    .gnd  { stroke:#7828B8; stroke-opacity:.28; stroke-width:1.4 }
    .cone { fill:#B870F0; fill-opacity:.30 }
    .shot { fill:none; stroke:#7828B8; stroke-opacity:.85; stroke-width:1.6 }
    .scn  { stroke:#7828B8; stroke-opacity:.5; stroke-width:1.3; fill:none }
    .pc   { fill:#7828B8; fill-opacity:.42 }
    .arw  { stroke:#7828B8; stroke-opacity:.5; stroke-width:1.4; fill:none }
    .mk   { stroke:#7828B8; stroke-width:1.8; fill:none }
  </style>

  <text class="step" x="14" y="24">1 — a picture you already have</text>
  <text class="cap"  x="14" y="42">a file, a phone, a drone, your own rig</text>
  <rect class="pane" x="10" y="54" width="252" height="180" rx="10"/>
  <rect class="shot" x="58" y="92" width="140" height="94" rx="4" stroke-opacity=".7"/>
  <g class="scn">
    <path d="M 58 156 H 198"/>
    <path d="M 88 156 V 122 H 118 V 156"/>
    <path d="M 140 156 V 134 H 176 V 156"/>
    <path d="M 58 122 L 88 122 M 176 122 H 198"/>
  </g>
  <text class="lens" x="128" y="206" text-anchor="middle">fx  fy  px  py</text>
  <text class="lens" x="128" y="222" text-anchor="middle" fill-opacity=".55">your lens numbers</text>
  <g opacity="0">
    <rect class="shot" x="-22" y="-16" width="44" height="32" rx="3"/>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;.10;.16;.34;.38;1"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear"
                   values="236,150; 236,150; 236,150; 398,150; 398,150; 398,150"
                   keyTimes="0;.10;.16;.34;.38;1"/>
  </g>

  <text class="step" x="290" y="24">2 — MultiSet VPS</text>
  <text class="cap"  x="290" y="42">matched against your map</text>
  <rect class="pane" x="286" y="54" width="196" height="180" rx="10">
    <animate attributeName="stroke-opacity" dur="7s" repeatCount="indefinite"
             values=".38;.38;.95;.35;.95;.38;.38"
             keyTimes="0;.34;.42;.47;.52;.60;1"/>
  </rect>
  <text class="num" x="384" y="148" text-anchor="middle" opacity="0">
    matching…
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;.34;.40;.56;.60;1"/>
  </text>
  <text class="num" x="384" y="148" text-anchor="middle">
    pose found
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;1;1;0" keyTimes="0;.60;.66;.94;1"/>
  </text>
  <path class="arw" d="M 486 144 H 566" marker-end="url(#ar)"/>

  <text class="step" x="574" y="24">3 — where it was taken</text>
  <text class="cap"  x="574" y="42">the pose, inside your point cloud</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img"
     aria-label="Your code supplies an image and lens numbers; multiset-vps rectifies it and calls the MultiSet API; a Pose comes back to your code.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B870F0" fill-opacity=".6"/>
    </marker>
  </defs>
  <style>
    .band  { fill:#C98CF4; fill-opacity:.07; stroke:#C98CF4; stroke-opacity:.30; stroke-width:1.3 }
    .ours  { fill:#C98CF4; fill-opacity:.12; stroke:#C98CF4; stroke-opacity:.55; stroke-width:1.8 }
    .chip  { fill:#C98CF4; fill-opacity:.15; stroke:#C98CF4; stroke-opacity:.55; stroke-width:1.3 }
    .lane  { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size:11px; font-weight:700; fill:#B870F0; fill-opacity:.75;
             letter-spacing:.06em; text-transform:uppercase }
    .name  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; font-weight:600; fill:#EBDCF9 }
    .desc  { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size:11px; fill:#B870F0; fill-opacity:.9 }
    .yours { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; fill:#EBDCF9 }
    .arw   { stroke:#B870F0; stroke-opacity:.6; stroke-width:1.5; fill:none }
    .flow  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10px; fill:#B870F0; fill-opacity:.8 }
  </style>
  <text class="lane" x="12" y="26">your code</text>
  <rect class="band" x="8" y="36" width="168" height="184" rx="10"/>
  <text class="yours" x="92" y="86"  text-anchor="middle">your image</text>
  <text class="desc"  x="92" y="104" text-anchor="middle">+ fx fy px py</text>
  <text class="yours" x="92" y="172" text-anchor="middle">if pose:</text>
  <text class="desc"  x="92" y="190" text-anchor="middle">do something</text>

  <text class="lane" x="204" y="26">multiset-vps — what the SDK does for you</text>
  <rect class="ours" x="200" y="36" width="466" height="184" rx="10"/>
  <rect class="chip" x="216" y="58" width="208" height="52" rx="8"/>
  <text class="name" x="320.0" y="81.0" text-anchor="middle">Rectifier</text>
  <text class="desc" x="320.0" y="98.0" text-anchor="middle">fisheye to flat, with new fx/fy</text>
  <rect class="chip" x="442" y="58" width="208" height="52" rx="8"/>
  <text class="name" x="546.0" y="81.0" text-anchor="middle">VPSClient</text>
  <text class="desc" x="546.0" y="98.0" text-anchor="middle">token, retries, one request</text>
  <rect class="chip" x="216" y="146" width="434" height="52" rx="8"/>
  <text class="name" x="433.0" y="169.0" text-anchor="middle">Pose</text>
  <text class="desc" x="433.0" y="186.0" text-anchor="middle">x  y  z  yaw_deg  confidence</text>

  <text class="lane" x="694" y="26">MultiSet</text>
  <rect class="band" x="690" y="36" width="182" height="184" rx="10"/>
  <text class="yours" x="781" y="86"  text-anchor="middle">your map</text>
  <text class="desc"  x="781" y="104" text-anchor="middle">the VPS service</text>

  <path class="arw" d="M 176 84 H 210" marker-end="url(#ar)"/>
  <path class="arw" d="M 424 84 H 436" marker-end="url(#ar)"/>
  <path class="arw" d="M 650 84 H 684" marker-end="url(#ar)"/>
  <path class="arw" d="M 690 172 H 656" marker-end="url(#ar)"/>
  <path class="arw" d="M 216 172 H 182" marker-end="url(#ar)"/>
</svg>
